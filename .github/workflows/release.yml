name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: macos-14
    permissions:
      contents: write
    env:
      APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Import Developer ID certificate
        if: ${{ env.APPLE_CERTIFICATE_BASE64 != '' }}
        run: |
          certificate_path="$RUNNER_TEMP/certificate.p12"
          keychain_path="$RUNNER_TEMP/build.keychain-db"
          echo -n "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"
          security create-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security list-keychain -d user -s "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$APPLE_KEYCHAIN_PASSWORD" "$keychain_path"
      - name: Test source
        run: |
          swift build
          python3 -m unittest discover -s tests -v
      - name: Build signed universal app
        env:
          CODESIGN_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          LIMITCHECKER_VERSION="$version" ./Scripts/build-app.sh
      - name: Notarize and staple
        if: ${{ env.APPLE_CERTIFICATE_BASE64 != '' && env.APPLE_ID != '' && env.APPLE_TEAM_ID != '' && env.APPLE_APP_PASSWORD != '' }}
        run: |
          notarization_archive="$RUNNER_TEMP/LimitChecker-notarization.zip"
          ditto -c -k --keepParent dist/LimitChecker.app "$notarization_archive"
          xcrun notarytool submit "$notarization_archive" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple dist/LimitChecker.app
          xcrun stapler validate dist/LimitChecker.app
      - name: Create release archive
        run: |
          version="${GITHUB_REF_NAME#v}"
          archive="dist/LimitChecker-$version-macos-universal.zip"
          ditto --norsrc -c -k --keepParent dist/LimitChecker.app "$archive"
          ./Scripts/create-dmg.sh "$version"
          for asset in "LimitChecker-$version-macos-universal.zip" "LimitChecker-$version-macos-universal.dmg"; do
            (cd dist && shasum -a 256 "$asset" > "$asset.sha256")
          done
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          logo="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/logo/limitchecker-logo.png"
          security_note="<img src=\"$logo\" width=\"180\" alt=\"LimitChecker logo\">"
          if [[ -n "$APPLE_CERTIFICATE_BASE64" && -n "$APPLE_ID" ]]; then
            security_note+=$'\n\nThis release is Developer ID signed and notarized by Apple.'
          else
            security_note+=$'\n\n## Important: first launch on macOS\n\nLimitChecker is a free personal open-source project. I have chosen not to maintain a paid Apple Developer Program membership, so Apple has not signed or notarized this download.\n\nAfter the first blocked launch, open **System Settings > Privacy & Security** and choose **Open Anyway** for LimitChecker. You only need to do this once. Only proceed when you downloaded the app from this repository and trust it.\n\nThis release is ad-hoc signed and not notarized by Apple.'
          fi
          security_note+=$'\n\nThe DMG opens with a drag-and-drop shortcut to Applications. The ZIP is available as an alternative.'
          security_note+=$'\n\nEach download ships a `.sha256` file beside it. Verify one with `shasum -c <file>.sha256`. The in-app updater checks the ZIP against its digest before installing.'
          gh release create "$GITHUB_REF_NAME" \
            "dist/LimitChecker-$version-macos-universal.zip" \
            "dist/LimitChecker-$version-macos-universal.zip.sha256" \
            "dist/LimitChecker-$version-macos-universal.dmg" \
            "dist/LimitChecker-$version-macos-universal.dmg.sha256" \
            --title "LimitChecker $version" \
            --notes "$security_note" \
            --generate-notes
